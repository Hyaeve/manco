plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'application'
}

group = 'com.hyaeve.manco'
version = '1.0.0'

def compatibilityDirectory = providers.gradleProperty('mihonCompatibilityDirectory')
def compatibilityRoot = compatibilityDirectory.map { new File(it) }.getOrNull()
if (compatibilityRoot == null) {
    throw new GradleException('Supply -PmihonCompatibilityDirectory=<pinned runtime directory>')
}
def compatibilityFiles = fileTree(compatibilityRoot) {
    include '*.jar'
}

dependencies {
    implementation project(':source-host')
    implementation project(':dex-convert')
    implementation project(':mihon-desktop-compat')
    implementation project(':core-source')
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:${libs.versions.coroutines.get()}"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:${libs.versions.serialization.get()}"
    runtimeOnly files(compatibilityFiles)
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

application {
    mainClass = 'org.skepsun.kototoro.mihonhost.MancoMihonHostKt'
}

tasks.named('installDist') {
    dependsOn ':mihon-desktop-compat:verifyWindowsRuntime'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
