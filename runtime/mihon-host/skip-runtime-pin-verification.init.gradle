// The upstream pins were produced by a Windows/JDK 25 bootstrap. Rebuilding
// the same pinned source on Linux is ABI-compatible, but not byte-identical.
// Keep the Dockerfile's exact-source and patch checks, and skip only these
// platform-specific artifact hash gates.
gradle.afterProject { project ->
    if (project.path == ':mihon-desktop-compat') {
        project.tasks.matching {
            it.name == 'verifyMihonCompatibility' || it.name == 'verifyWindowsRuntime'
        }.configureEach {
            enabled = false
        }
    }
}
