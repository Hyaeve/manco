services:
  manco:
    image: ghcr.io/hyaeve/manco:latest
    container_name: Manco
    network_mode: bridge
    ports:
      - 15600:15600
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      # 自定义下载目录示例；不需要时删除，下载位置在订阅任务里选择容器内目录。
      - /vol3/1000/家庭影音/:/家庭影音:shared
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped
