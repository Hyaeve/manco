services:
  manco:
    image: ghcr.io/hyaeve/manco:latest
    container_name: Manco
    network_mode: bridge
    ports:
      - 15600:15600
    volumes:
      - ./data:/data
      - ./config:/app/config
      # 运行数据固定写入 /data；配置单独写入 /app/config。
    environment:
      - TZ=Asia/Shanghai
      - MANCO_DATA_DIR=/data
      - MANCO_CONFIG_DIR=/app/config
    restart: unless-stopped
