services:
  manco:
    image: ghcr.io/hyaeve/manco:latest
    container_name: Manco
    network_mode: bridge
    ports:
      - 15600:15600
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      # 按需映射下载目录，例如：
      # - ./Manco:/Manco:shared
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped
